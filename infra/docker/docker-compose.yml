# Local development stack (Phase 2 doc 08 §4). Brings up the backing services the core-api and
# apps need; `pnpm dev` runs the app processes against these. No production data ever touches
# these containers — the seed runner loads synthetic bilingual data (Phase 3 doc 04 §5).
name: infoenc-dev

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: infoenc
      POSTGRES_PASSWORD: infoenc_dev
      POSTGRES_DB: infoenc
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U infoenc"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  meilisearch:
    image: getmeili/meilisearch:v1.11
    environment:
      MEILI_ENV: development
      MEILI_MASTER_KEY: dev_master_key
    ports:
      - "7700:7700"
    volumes:
      - meilidata:/meili_data

  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: infoenc
      MINIO_ROOT_PASSWORD: infoenc_dev_secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # web UI
    environment:
      MP_MAX_MESSAGES: "500"

volumes:
  pgdata:
  redisdata:
  meilidata:
  miniodata:
